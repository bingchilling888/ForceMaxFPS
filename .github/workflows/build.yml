name: Build Force Max FPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build the mod
        run: gradle build --stacktrace
        env:
          GRADLE_OPTS: -Xmx3G

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForceMaxFPS
          path: build/libs/*.jar
          if-no-files-found: warn
